services:
  postgres:
    image: postgres:17-alpine
    container_name: corebanking-postgres
    environment:
      POSTGRES_DB: corebanking
      POSTGRES_USER: corebanking
      POSTGRES_PASSWORD: corebanking
    ports:
      - "5432:5432"
    volumes:
      - corebanking-pgdata:/var/lib/postgresql/data

volumes:
  corebanking-pgdata:

