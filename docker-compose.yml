services:
  postgres:
    image: postgres:17-alpine
    container_name: corebanking-postgres
    environment:
      POSTGRES_DB: corebanking
      POSTGRES_USER: corebanking
      POSTGRES_PASSWORD: corebanking
    ports:
      - "5432:5432"
    volumes:
      - corebanking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U corebanking -d corebanking" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: corebanking-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: corebanking
      RABBITMQ_DEFAULT_PASS: corebanking
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    container_name: corebanking-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/corebanking
      SPRING_DATASOURCE_USERNAME: corebanking
      SPRING_DATASOURCE_PASSWORD: corebanking
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: corebanking
      SPRING_RABBITMQ_PASSWORD: corebanking
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: corebanking-frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  corebanking-pgdata:

